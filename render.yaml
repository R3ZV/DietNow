# Render Blueprint for the DietNow STAGING environment (see docs/DEPLOYMENT.md).
#
# Creates one web service running the release image (Go API + built frontend on
# one origin) and one managed PostgreSQL 16 database. No secret values live in
# this file: the database password is generated by Render and injected through
# `fromDatabase`.
#
# Deploys are NOT triggered by Render itself (autoDeploy: false). The GitHub
# workflow .github/workflows/deploy-staging.yml calls the service's deploy hook
# with the exact image to run (ghcr.io/<owner>/dietnow:<git sha>), verifies it
# and rolls back on failure.
services:
  - type: web
    name: dietnow-staging
    runtime: image
    image:
      # Initial image only; every deploy sets the image explicitly.
      url: ghcr.io/r3zv/dietnow:master
      # If the GHCR package is private, create a registry credential named
      # "ghcr-dietnow" in Render (GitHub user + PAT with read:packages) and
      # uncomment:
      # creds:
      #   fromRegistryCreds:
      #     name: ghcr-dietnow
    plan: free
    region: frankfurt
    # Render only switches traffic to a new deploy once this returns 200, so a
    # release that cannot reach the database never goes live.
    healthCheckPath: /api/health/ready
    autoDeploy: false
    envVars:
      - key: APP_ENV
        value: staging
      # Migrations + reference food catalog run at startup, before the server
      # accepts traffic. Set to false and use a pre-deploy command
      # (`/app/migrate`) on a paid plan if you prefer a separate step.
      - key: DB_AUTO_MIGRATE
        value: "true"
      - key: DB_HOST
        fromDatabase: { name: dietnow-staging-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: dietnow-staging-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: dietnow-staging-db, property: database }
      - key: DB_USER
        fromDatabase: { name: dietnow-staging-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: dietnow-staging-db, property: password }
      - key: DB_SSLMODE
        value: prefer
      - key: DB_LOG_LEVEL
        value: warn
      - key: DB_MAX_OPEN_CONNS
        value: "10"
      # Frontend and API share the onrender.com origin, so no CORS origins.
      - key: API_ALLOWED_ORIGINS
        value: ""
      - key: COOKIE_SECURE
        value: "true"
      - key: SESSION_COOKIE_NAME
        value: __Host-dietnow_session
      - key: COOKIE_DOMAIN
        value: ""
      - key: SESSION_TTL_HOURS
        value: "168"
      - key: SESSION_IDLE_MINUTES
        value: "1440"
      - key: BCRYPT_COST
        value: "12"

databases:
  - name: dietnow-staging-db
    plan: free
    region: frankfurt
    databaseName: dietnow
    user: dietnow
    postgresMajorVersion: "16"
    # Only reachable from Render services in the same region (no public access).
    ipAllowList: []
